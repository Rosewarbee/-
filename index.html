<!doctype html>
<html lang="th">
<head>
  
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#eef2ff}
.layout{display:flex;min-height:100vh}
aside{width:240px;background:#121a2b;padding:20px;border-right:1px solid #26334d}
.logo{font-size:21px;font-weight:bold;margin-bottom:30px}
.logo span{color:#9a84ff}
.nav{display:block;width:100%;padding:12px;margin:5px 0;border:0;border-radius:10px;background:transparent;color:#9aa8c7;text-align:left;cursor:pointer;font-size:14px}
.nav:hover,.nav.active{background:#182238;color:#fff}
main{flex:1}
header{height:70px;padding:0 30px;background:#121a2b;border-bottom:1px solid #26334d;display:flex;align-items:center;justify-content:space-between}
.content{padding:30px;max-width:1400px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{margin:0}
.muted{color:#9aa8c7}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card,.panel{background:#121a2b;border:1px solid #26334d;border-radius:15px}
.card{padding:20px}
.metric{font-size:28px;font-weight:bold;margin-top:12px}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:15px;margin-top:18px}
.panel{overflow:hidden}
.panel-head{padding:18px 20px;border-bottom:1px solid #26334d;font-weight:bold}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:15px 20px;border-bottom:1px solid #26334d;font-size:13px}
th{color:#9aa8c7;font-size:11px}
button.primary{border:0;background:linear-gradient(135deg,#6d4aff,#9a84ff);color:white;border-radius:9px;padding:11px 16px;font-weight:bold;cursor:pointer}
.badge{padding:5px 8px;border-radius:7px;font-size:11px}
.ok{color:#38d996;background:#183b32}
.pending{color:#e6ad39;background:#3b3219}
.modal{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:20px}
.modal-box{width:min(650px,100%);background:#121a2b;border:1px solid #26334d;border-radius:18px;overflow:hidden}
.form{padding:20px}
input,select{width:100%;padding:11px;margin-top:7px;background:#182238;color:white;border:1px solid #26334d;border-radius:9px}
label{display:block;margin-bottom:15px;font-size:13px;font-weight:bold}
@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
@media(max-width:650px){aside{display:none}.cards{grid-template-columns:1fr}.content{padding:18px}}
</style>
</head>

<body><div id="siteLock" style="position:fixed;inset:0;background:#0b1020;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px">
<div style="width:min(420px,100%);background:#121a2b;border:1px solid #26334d;border-radius:16px;padding:28px;text-align:center;color:#eef2ff">
<div style="font-size:40px;margin-bottom:14px">♫</div>
<h2>เข้าสู่เว็บไซต์</h2>
<p style="color:#9aa8c7;font-size:13px">กรุณาใส่รหัสผ่านเพื่อเข้าใช้งาน</p>
<form onsubmit="return unlockSite(event)">
<input id="sitePassword" type="password" placeholder="รหัสผ่าน" autocomplete="off" required style="width:100%;padding:12px;border-radius:10px;border:1px solid #26334d;background:#182238;color:white">
<div id="lockError" style="display:none;color:#ff7085;font-size:12px;margin-top:8px">รหัสผ่านไม่ถูกต้อง</div>
<button type="submit" style="width:100%;margin-top:15px;padding:12px;border:0;border-radius:10px;background:#9a84ff;color:white;font-weight:bold">เข้าสู่เว็บไซต์</button>
</form>
</div>
</div>
  
<div class="layout">

<aside>
<div class="logo">♫ Music<span>Admin</span></div>

<button class="nav active" onclick="show('dashboard',this)">▦ Dashboard</button>
<button class="nav" onclick="show('songs',this)">♬ เพลง</button>
<button class="nav" onclick="show('members',this)">♙ สมาชิก</button>
<button class="nav" onclick="show('earnings',this)">฿ รายได้</button>
<button class="nav" onclick="show('withdrawals',this)">⇄ รายการถอนเงิน</button>
<button class="nav" onclick="show('settings',this)">⚙ ตั้งค่า</button>
</aside>

<main>
<header>
<b>หน้าหลัก / Dashboard</b>
<span class="muted">Administrator</span>
</header>

<section class="content" id="content"></section>
</main>
</div>

<div class="modal" id="songModal">
<div class="modal-box">
<div class="panel-head">เพิ่มเพลงใหม่</div>

<form class="form" onsubmit="saveSong(event)">
<label>ชื่อเพลง
<input id="title" required placeholder="ชื่อเพลง">
</label>

<label>ศิลปิน
<input id="artist" required placeholder="ชื่อศิลปิน">
</label>

<label>ไฟล์เพลง
<input id="file" type="file" accept="audio/*" required>
</label>

<label>รูปปก
<input id="cover" type="file" accept="image/*">
</label>

<label>สถานะ
<select id="status">
<option>กำลังใช้งาน</option>
<option>รอตรวจสอบ</option>
<option>ปิดการใช้งาน</option>
</select>
</label>

<div style="text-align:right">
<button type="button" class="nav" style="display:inline-block;width:auto" onclick="closeSong()">ยกเลิก</button>
<button class="primary">บันทึกเพลง</button>
</div>
</form>
</div>
</div>

function settings(){

function show(page,btn){
document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
if(btn)btn.classList.add('active');

if(page==='dashboard')dashboard();
if(page==='songs')songs();
if(page==='members')members();
if(page==='earnings')earnings();
if(page==='withdrawals')withdrawals();
if(page==='settings')settings();
}

function openSong(){
document.getElementById('songModal').style.display='flex';
}

function closeSong(){
document.getElementById('songModal').style.display='none';
}

function saveSong(e){
e.preventDefault();

const title=document.getElementById('title').value;
const artist=document.getElementById('artist').value;
const status=document.getElementById('status').value;

let songs=JSON.parse(localStorage.getItem('musicSongs')||'[]');

songs.unshift({
title:title,
artist:artist,
status:status,
plays:0
});

localStorage.setItem('musicSongs',JSON.stringify(songs));

closeSong();
alert('เพิ่มเพลงเรียบร้อยแล้ว');
songs();
}

function youtube(){
window.open(
'https://www.youtube.com/embed/5c-y_LTDpSo',
'_blank'
);
}

dashboard();
function unlockSite(e){
  e.preventDefault();
  const p=document.getElementById('sitePassword').value.trim();
  if(p==='123456'){
    document.getElementById('siteLock').style.display='none';
    document.getElementById('sitePassword').value='';
    return false;
  }
  document.getElementById('lockError').style.display='block';
  document.getElementById('sitePassword').focus();
  return false;
}
</script>

</html>
